name: Build and Test

# Post-merge build safety net: configure, build, and run the test suite on a
# Debian/Ubuntu runner. It builds the pinned libindi 2.x client from source
# (Ubuntu's own universe still ships 1.9.9, below the required 2.0, and the
# INDI PPA no longer publishes libindi), and builds open-source-only
# (no proprietary camera SDKs).
#
# Deliberately NOT run on pull requests: the full compile takes long enough
# that it slowed PR iteration, so PRs get the fast checks only (clang-format,
# clang-tidy/cppcheck on changed lines, Claude review) and the compile runs
# after merge to main. A build-breaking merge is caught here and can be
# reverted or fixed forward.
#
# MERGE POLICY: before merging a PR with large or risky C++ changes, kick
# this workflow off manually against the PR branch (Actions tab -> Build and
# Test -> "Run workflow" -> pick the branch) and wait for green. Small or
# non-C++ PRs can merge on the fast checks alone; if a merge does break main,
# this run flags it within the hour - revert or fix forward promptly so other
# merges aren't building on a broken base.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux build + ctest
    # Pinned (not ubuntu-latest) so a new LTS image with renamed/incompatible
    # INDI PPA packages can't break CI without a code change.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Dependency list is derived from debian/control Build-Depends and the
      # apt hint in run_deb.sh. wxWidgets 3.2 dev, cfitsio, libnova, gettext,
      # opencv, eigen, curl, gtest. USE_SYSTEM_GTEST=1 links the distro gtest.
      #
      # libindi is deliberately NOT taken from apt. Ubuntu's universe ships
      # libindi 1.9.9 but the project requires INDI >= 2.0, and the INDI PPA
      # (ppa:mutlaqja/ppa) that used to supply 2.x had its libindi packages
      # deleted on 2026-08-25, which broke every Linux job. USE_SYSTEM_LIBINDI=0
      # makes thirdparty/thirdparty.cmake build the pinned INDI client
      # statically from the indilib/indi git tag instead (~3 min), which
      # removes the third-party apt source from CI entirely.
      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            gettext \
            libwxgtk3.2-dev \
            wx-common \
            libcfitsio-dev \
            libnova-dev \
            libopencv-dev \
            libeigen3-dev \
            libv4l-dev \
            libcurl4-gnutls-dev \
            libgtest-dev \
            zlib1g-dev \
            libx11-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_LIBINDI=0 \
            -DUSE_SYSTEM_GTEST=1 \
            -DOPENSOURCE_ONLY=1

      - name: Build
        # Cap parallelism: the gaussian_process/Eigen translation units are
        # memory-heavy and full -j on the hosted runner OOM-kills the job
        # (exit 143). Two jobs keeps peak RAM under the runner's limit.
        run: cmake --build build --parallel 2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
