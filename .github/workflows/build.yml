name: Build and Test

# Post-merge build safety net: configure, build, and run the test suite on a
# Debian/Ubuntu runner. It installs libindi 2.x from the official INDI PPA
# (Ubuntu's own universe still ships 1.9.9, below the required 2.0) rather
# than the from-source INDI path in run_deb.sh, and builds open-source-only
# (no proprietary camera SDKs).
#
# Deliberately NOT run on pull requests: the full compile takes long enough
# that it slowed PR iteration, so PRs get the fast checks only (clang-format,
# Claude review) and the compile runs after merge to main. A build-breaking
# merge is caught here and can be reverted or fixed forward. workflow_dispatch
# lets you run it on any branch by hand when a PR looks build-risky.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Linux build + ctest
    # Pinned (not ubuntu-latest) so a new LTS image with renamed/incompatible
    # INDI PPA packages can't break CI without a code change.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      # Dependency list is derived from debian/control Build-Depends and the
      # apt hint in run_deb.sh. wxWidgets 3.2 dev, cfitsio, libnova, gettext,
      # libindi-dev, opencv, eigen, curl, gtest. USE_SYSTEM_LIBINDI/GTEST=1
      # so we link the distro packages instead of building them from source.
      - name: Install build dependencies
        run: |
          # Ubuntu's universe ships libindi 1.9.9, but the project requires
          # INDI >= 2.0. The official INDI PPA (maintained by the INDI project
          # lead) provides current libindi 2.x. Trust boundary: this adds a
          # third-party apt source to the CI runner; it only supplies libindi
          # dev packages used at build time, not runtime artifacts we ship.
          sudo add-apt-repository -y ppa:mutlaqja/ppa
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential \
            cmake \
            pkg-config \
            gettext \
            libwxgtk3.2-dev \
            wx-common \
            libcfitsio-dev \
            libnova-dev \
            libindi-dev \
            libopencv-dev \
            libeigen3-dev \
            libv4l-dev \
            libcurl4-gnutls-dev \
            libgtest-dev \
            zlib1g-dev \
            libx11-dev

      - name: Configure
        run: |
          cmake -S . -B build \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_LIBINDI=1 \
            -DUSE_SYSTEM_GTEST=1 \
            -DOPENSOURCE_ONLY=1

      - name: Build
        # Cap parallelism: the gaussian_process/Eigen translation units are
        # memory-heavy and full -j on the hosted runner OOM-kills the job
        # (exit 143). Two jobs keeps peak RAM under the runner's limit.
        run: cmake --build build --parallel 2

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
