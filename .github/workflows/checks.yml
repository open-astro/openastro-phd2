name: Checks

# Fast, no-compile checks that gate pull requests (plus a backstop run on
# pushes to main). Everything here finishes in seconds to a few minutes;
# the expensive full compile lives in build.yml (post-merge) and the
# sanitizer builds in sanitizers.yml.
#
# clang-format lives in its own workflow (clang-format-check.yml).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    name: clang-tidy (changed lines)
    # Only meaningful for PRs: on main pushes there is no diff to scope to.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      # clang-tidy needs a compile database, which needs the same dev packages
      # the real build uses — but only a CMake *configure*, not a compile.
      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:mutlaqja/ppa
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential cmake pkg-config gettext clang-tidy-18 \
            libwxgtk3.2-dev wx-common libcfitsio-dev libnova-dev libindi-dev \
            libopencv-dev libeigen3-dev libv4l-dev libcurl4-gnutls-dev \
            libgtest-dev zlib1g-dev libx11-dev

      - name: Generate compile database
        run: |
          cmake -S . -B build \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DUSE_SYSTEM_LIBINDI=1 \
            -DUSE_SYSTEM_GTEST=1 \
            -DOPENSOURCE_ONLY=1

      # Scope to the lines this PR changed so pre-existing findings elsewhere
      # never fail the PR. Check set: bugprone + performance, plus the Clang
      # Static Analyzer (clang-analyzer-*) for path-sensitive analysis —
      # deeper than the lint checks, still bounded by the diff size.
      # clang-tidy-diff-18.py has no -warnings-as-errors flag (unrecognized in
      # LLVM 18), so gate on the output: any diagnostic from the enabled check
      # families within the changed lines fails the job.
      - name: Run clang-tidy on changed lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          # The default Actions shell is `bash -e` WITHOUT pipefail, so a
          # failing `git diff` on the left of the pipe would hand clang-tidy
          # empty input and pass the gate green; pipefail surfaces it in ret.
          set -o pipefail
          ret=0
          out=$(git diff -U0 "$base"..HEAD -- 'src/**/*.cpp' 'src/**/*.h' \
            'contributions/MPI_IS_gaussian_process/**/*.cpp' \
            'contributions/MPI_IS_gaussian_process/**/*.h' \
            | clang-tidy-diff-18.py -p1 -path build -quiet \
                -checks='-*,bugprone-*,performance-*,clang-analyzer-*,-bugprone-easily-swappable-parameters') || ret=$?
          echo "$out"
          # Match any diagnostic line, not just ones carrying a recognized
          # check name in brackets — with -checks scoped above, every
          # diagnostic here is one of ours, and format drift in how the
          # check name is printed must not silently clear the gate.
          if echo "$out" | grep -qE '(warning|error): '; then
            echo "::error::clang-tidy found issues on the changed lines (see above)."
            exit 1
          fi
          # A nonzero exit with no recognized diagnostic means the tool
          # itself failed (crash, bad invocation) — fail rather than let a
          # broken gate pass green.
          if [ "$ret" -ne 0 ]; then
            echo "::error::clang-tidy-diff exited $ret without reporting diagnostics — tool failure, not a clean pass."
            exit 1
          fi

  cppcheck:
    name: cppcheck (changed files)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install cppcheck
        run: sudo apt-get update -q && sudo apt-get install -y -q cppcheck

      # Only the C++ files the PR touched. `--error-exitcode=1` fails on
      # error-severity findings; warnings are printed but advisory.
      # Known limitation: runs without -I include paths or a compile
      # database, so project-macro-dependent code can yield false
      # positives/negatives (the missingIncludeSystem/unknownMacro
      # suppressions absorb the noise). The compile-database-backed deep
      # pass is the clang-tidy job above; cppcheck is a cheap second
      # opinion, not the primary gate.
      - name: Run cppcheck on changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base "$BASE_SHA" HEAD)
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$base"..HEAD \
            -- 'src/**/*.cpp' 'src/**/*.h' 'contributions/MPI_IS_gaussian_process/**/*.cpp' \
               'contributions/MPI_IS_gaussian_process/**/*.h')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C++ files changed; skipping."
            exit 0
          fi
          printf 'Checking: %s\n' "${files[@]}"
          cppcheck \
            --enable=warning,performance,portability \
            --inline-suppr \
            --suppress=missingIncludeSystem \
            --suppress=unknownMacro \
            --error-exitcode=1 \
            --std=c++20 \
            "${files[@]}"

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # shellcheck is preinstalled on GitHub Ubuntu images. Covers tracked
      # *.sh plus the extensionless shell helpers under build/. Gate on
      # error severity so long-standing style warnings don't block; tighten
      # to warning once the scripts are clean.
      - name: Run ShellCheck
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          # Also pick up extensionless scripts by shebang, wherever they
          # live, so new helper scripts are covered automatically.
          while IFS= read -r f; do
            case "${f##*/}" in *.*) continue ;; esac
            [ -f "$f" ] && head -1 "$f" | grep -q '^#!.*\bsh' && files+=("$f")
          done < <(git ls-files)
          # Zero files would make shellcheck print usage and exit non-zero —
          # a spurious failure, not a finding.
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts tracked; skipping."
            exit 0
          fi
          printf 'Checking: %s\n' "${files[@]}"
          shellcheck --severity=error "${files[@]}"

  unicode-scan:
    name: Unicode scan (trojan source)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Reject invisible / bidirectional-override code points that can make
      # displayed source differ from what the compiler sees (CVE-2021-42574
      # "trojan source"). locale/ is excluded: translation files legitimately
      # contain RTL marks for Arabic and similar locales.
      - name: Scan for dangerous invisible characters
        run: |
          python3 - <<'EOF'
          import subprocess, sys
          DANGEROUS = {
              0x202A, 0x202B, 0x202C, 0x202D, 0x202E,     # bidi embedding/override
              0x2066, 0x2067, 0x2068, 0x2069,             # bidi isolates
              0x200B, 0x200C, 0x200D, 0x200E, 0x200F,     # zero-width + marks
              0x00AD, 0x2060, 0xFEFF,                     # soft hyphen, WJ, ZWNBSP
          }
          SKIP_EXT = ('.png', '.ico', '.icns', '.jpg', '.gif', '.zip', '.mo',
                      '.pdf', '.fit', '.fits', '.exe', '.dll')
          files = subprocess.run(['git', 'ls-files'], capture_output=True,
                                 text=True, check=True).stdout.splitlines()
          bad = []
          for f in files:
              if f.startswith('locale/') or f.lower().endswith(SKIP_EXT):
                  continue
              try:
                  # utf-8-sig strips a legitimate leading BOM (e.g. the one in
                  # .clang-format) while still flagging U+FEFF anywhere else.
                  text = open(f, encoding='utf-8-sig').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue  # binary or symlink; not a text-source concern
              for lineno, line in enumerate(text.splitlines(), 1):
                  for ch in line:
                      if ord(ch) in DANGEROUS:
                          bad.append(f"{f}:{lineno}: U+{ord(ch):04X}")
          if bad:
              print("Dangerous invisible/bidi characters found:")
              print("\n".join(bad))
              sys.exit(1)
          print(f"Scanned {len(files)} tracked files: clean.")
          EOF

  js-syntax:
    name: JavaScript syntax
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # The project has no standalone .js files; its JavaScript lives inline
      # in <script> blocks (web UI in scripts/webui/index.html). Extract each
      # block and run it through node --check. Standalone .js files, if ever
      # added, are checked directly.
      - name: Syntax-check JavaScript
        run: |
          python3 - <<'EOF'
          import re, subprocess, sys, tempfile, os
          files = subprocess.run(['git', 'ls-files', '*.js', '*.html', '*.htm'],
                                 capture_output=True, text=True, check=True).stdout.splitlines()
          failed = False
          checked = 0
          for f in files:
              try:
                  text = open(f, encoding='utf-8', errors='replace').read()
              except FileNotFoundError:
                  continue
              blocks = []
              if f.endswith('.js'):
                  blocks = [(1, text)]
              else:
                  for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',
                                       text, re.DOTALL | re.IGNORECASE):
                      if m.group(1).strip():
                          lineno = text[:m.start(1)].count('\n') + 1
                          blocks.append((lineno, m.group(1)))
              for lineno, code in blocks:
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False,
                                                   encoding='utf-8') as tf:
                      tf.write(code)
                      path = tf.name
                  r = subprocess.run(['node', '--check', path],
                                     capture_output=True, text=True)
                  os.unlink(path)
                  checked += 1
                  if r.returncode != 0:
                      print(f"{f}:{lineno}: JavaScript syntax error")
                      print(r.stderr)
                      failed = True
          print(f"Checked {checked} script block(s).")
          sys.exit(1 if failed else 0)
          EOF

  zizmor:
    name: zizmor (workflow audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      # Static security audit of the GitHub Actions workflows themselves
      # (unpinned actions, credential persistence, template injection, ...).
      # --offline skips audits that need the GitHub API, so no token is used.
      # Per-finding ignores live in .github/zizmor.yml. Hash-pinned for the
      # same reason the workflows SHA-pin their actions: version pinning
      # alone would still trust whatever PyPI serves for that version, so
      # pip verifies the exact wheel. Both linux hashes are listed (pip
      # picks the one matching the platform) so moving this job to an arm
      # runner doesn't break the hash check.
      - name: Run zizmor
        run: |
          printf '%s\n' 'zizmor==1.26.1 --hash=sha256:6a958d8a0941d7e1d0de8436670b5cb7fc64c8028b4d16e3f519ccc77f953cef --hash=sha256:bb7ebbe565a3742eb49a590352127ad549bb122b9b4ff9424ebab7525fa3b6b6' > "$RUNNER_TEMP/zizmor-req.txt"
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet --require-hashes --only-binary :all: -r "$RUNNER_TEMP/zizmor-req.txt"
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --offline .github/workflows/
