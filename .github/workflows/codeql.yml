name: CodeQL

# Semantic security analysis of the C++ tree. CodeQL builds the project to
# construct its database, so — like the sanitizers — it stays off pull
# requests and runs as a post-merge check on main, weekly, and on demand.
# Findings appear under the repository's Security > Code scanning tab.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC, an hour after the sanitizers
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C++
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Same dependency set as build.yml.
      - name: Install build dependencies
        run: |
          sudo add-apt-repository -y ppa:mutlaqja/ppa
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            build-essential cmake pkg-config gettext \
            libwxgtk3.2-dev wx-common libcfitsio-dev libnova-dev libindi-dev \
            libopencv-dev libeigen3-dev libv4l-dev libcurl4-gnutls-dev \
            libgtest-dev zlib1g-dev libx11-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          languages: c-cpp
          # security-extended adds lower-severity/precision security queries
          # on top of the default suite; quality queries stay out to keep the
          # signal actionable.
          queries: security-extended

      # CodeQL traces the compiler, so the project must actually build here.
      # Same parallelism cap as build.yml (Eigen TUs are memory-heavy, and
      # CodeQL's tracer adds overhead on top).
      - name: Build
        run: |
          cmake -S . -B build \
            -Wno-dev \
            -DCMAKE_BUILD_TYPE=Release \
            -DUSE_SYSTEM_LIBINDI=1 \
            -DUSE_SYSTEM_GTEST=1 \
            -DOPENSOURCE_ONLY=1
          cmake --build build --parallel 2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          category: '/language:c-cpp'
